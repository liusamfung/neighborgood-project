<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Crear encuesta</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="--p:#0F766E;--pc:#D5EFEA;--bg:#F6F8F7;--t:#1F2937;--m:#5B6672;--line:#E2E8E6;width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;font-family:'Inter',system-ui,sans-serif;color:var(--t);background:var(--bg)">

<div style="height:64px;flex:none;display:flex;align-items:center;gap:4px;padding:0 8px">
<button aria-label="Volver" style="width:44px;height:44px;border:0;background:transparent;color:var(--t);display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></button>
<div style="font-size:20px;font-weight:700">Nueva encuesta</div>
</div>

<div style="padding:4px 20px 0">
<label for="titulo" style="display:block;font-size:14px;font-weight:600;margin-bottom:6px">Título</label>
<input id="titulo" value="Renovación del ascensor" style="width:100%;height:48px;box-sizing:border-box;border:1px solid #CBD5D1;border-radius:12px;padding:0 14px;font:400 16px 'Inter',system-ui,sans-serif;color:#1F2937;background:#ffffff">
</div>

<div style="margin:14px 20px 0;padding:16px;border-radius:16px;background:#ffffff;border:1px solid var(--line);display:flex;flex-direction:column;gap:8px">
<div style="font-size:12px;font-weight:600;color:var(--p)">PREGUNTA 1</div>
<input aria-label="Pregunta 1" value="¿Aprueba el cambio del ascensor?" style="width:100%;height:46px;box-sizing:border-box;border:1px solid #CBD5D1;border-radius:12px;padding:0 14px;font:600 15px 'Inter',system-ui,sans-serif;color:#1F2937;background:#ffffff">
<input aria-label="Opción 1" value="Sí, apruebo" style="width:100%;height:42px;box-sizing:border-box;border:1px solid #CBD5D1;border-radius:12px;padding:0 14px;font:400 15px 'Inter',system-ui,sans-serif;color:#1F2937;background:#ffffff">
<input aria-label="Opción 2" value="No, no apruebo" style="width:100%;height:42px;box-sizing:border-box;border:1px solid #CBD5D1;border-radius:12px;padding:0 14px;font:400 15px 'Inter',system-ui,sans-serif;color:#1F2937;background:#ffffff">
<input aria-label="Opción 3" value="Me abstengo" style="width:100%;height:42px;box-sizing:border-box;border:1px solid #CBD5D1;border-radius:12px;padding:0 14px;font:400 15px 'Inter',system-ui,sans-serif;color:#1F2937;background:#ffffff">
<div style="display:flex;align-items:center;justify-content:space-between;margin-top:2px">
<button style="height:44px;border:0;background:transparent;color:#0F766E;font:600 14px 'Inter',system-ui,sans-serif;display:flex;align-items:center;gap:6px;padding:0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>Agregar opción</button>
<div style="display:flex;align-items:center;gap:8px;font-size:14px"><span style="width:44px;height:26px;border-radius:13px;background:#CBD5D1;display:flex;align-items:center;justify-content:flex-start;padding:0 3px;box-sizing:border-box"><span style="width:20px;height:20px;border-radius:10px;background:#ffffff"></span></span>Varias respuestas</div>
</div>
</div>

<div style="margin:10px 20px 0">
<button style="width:100%;height:48px;border:2px dashed #0F766E;border-radius:12px;background:#ffffff;color:#0F766E;font:600 15px 'Inter',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;gap:8px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>Agregar pregunta</button>
</div>

<div style="margin:14px 20px 0">
<div style="font-size:14px;font-weight:600;margin-bottom:8px">Dirigida a</div>
<div style="display:flex;gap:8px;flex-wrap:wrap">
<div style="font-size:14px;font-weight:600;background:#0F766E;color:#ffffff;padding:8px 14px;border-radius:999px">Todo el condominio</div>
<div style="font-size:14px;font-weight:500;background:#ffffff;color:#1F2937;padding:7px 14px;border-radius:999px;border:1px solid #CBD5D1">Torre A</div>
<div style="font-size:14px;font-weight:500;background:#ffffff;color:#1F2937;padding:7px 14px;border-radius:999px;border:1px solid #CBD5D1">Torre B</div>
</div>
</div>

<div style="margin:12px 20px 0;padding:0 16px;height:52px;border-radius:12px;background:#ffffff;border:1px solid var(--line);display:flex;align-items:center;justify-content:space-between">
<div style="font-size:15px;font-weight:600">Encuesta obligatoria</div>
<span style="width:44px;height:26px;border-radius:13px;background:#0F766E;display:flex;align-items:center;justify-content:flex-end;padding:0 3px;box-sizing:border-box"><span style="width:20px;height:20px;border-radius:10px;background:#ffffff"></span></span>
</div>

<div style="margin-top:auto;padding:0 20px 28px">
<button style="width:100%;height:56px;border:0;border-radius:12px;background:#0F766E;color:#ffffff;font:700 17px 'Inter',system-ui,sans-serif">Publicar encuesta</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
