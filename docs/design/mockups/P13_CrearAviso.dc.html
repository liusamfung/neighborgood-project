<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Crear aviso</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="--p:#0F766E;--pc:#D5EFEA;--bg:#F6F8F7;--t:#1F2937;--m:#5B6672;--line:#E2E8E6;width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;font-family:'Inter',system-ui,sans-serif;color:var(--t);background:var(--bg)">

<div style="height:64px;flex:none;display:flex;align-items:center;gap:4px;padding:0 8px">
<button aria-label="Volver" style="width:44px;height:44px;border:0;background:transparent;color:var(--t);display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></button>
<div style="font-size:20px;font-weight:700">Nuevo aviso</div>
</div>

<div style="padding:8px 20px 0;display:flex;flex-direction:column;gap:16px">

<div>
<label for="titulo" style="display:block;font-size:14px;font-weight:600;margin-bottom:6px">Título</label>
<input id="titulo" value="Corte de agua programado" style="width:100%;height:52px;box-sizing:border-box;border:1px solid #CBD5D1;border-radius:12px;padding:0 14px;font:400 16px 'Inter',system-ui,sans-serif;color:#1F2937;background:#ffffff">
</div>

<div>
<div style="font-size:14px;font-weight:600;margin-bottom:8px">Categoría</div>
<div style="display:flex;gap:8px">
<div style="font-size:14px;font-weight:600;background:#0F766E;color:#ffffff;padding:8px 14px;border-radius:999px">Mantenimiento</div>
<div style="font-size:14px;font-weight:500;background:#ffffff;color:#1F2937;padding:7px 14px;border-radius:999px;border:1px solid #CBD5D1">Seguridad</div>
<div style="font-size:14px;font-weight:500;background:#ffffff;color:#1F2937;padding:7px 14px;border-radius:999px;border:1px solid #CBD5D1">Comunidad</div>
</div>
</div>

<div>
<label for="msg" style="display:block;font-size:14px;font-weight:600;margin-bottom:6px">Mensaje</label>
<textarea id="msg" rows="4" style="width:100%;height:120px;box-sizing:border-box;border:1px solid #CBD5D1;border-radius:12px;padding:12px 14px;font:400 16px 'Inter',system-ui,sans-serif;color:#1F2937;background:#ffffff;resize:none">Mañana jueves de 9:00 a 13:00 habrá corte de agua por trabajos en la cisterna. Guarda agua para el día.</textarea>
</div>

<div>
<div style="font-size:14px;font-weight:600;margin-bottom:8px">Dirigido a</div>
<div style="display:flex;gap:8px;flex-wrap:wrap">
<div style="font-size:14px;font-weight:500;background:#ffffff;color:#1F2937;padding:7px 14px;border-radius:999px;border:1px solid #CBD5D1">Todo el condominio</div>
<div style="font-size:14px;font-weight:600;background:#0F766E;color:#ffffff;padding:8px 14px;border-radius:999px">Torre A</div>
<div style="font-size:14px;font-weight:500;background:#ffffff;color:#1F2937;padding:7px 14px;border-radius:999px;border:1px solid #CBD5D1">Torre B</div>
<div style="font-size:14px;font-weight:500;background:#ffffff;color:#1F2937;padding:7px 14px;border-radius:999px;border:1px solid #CBD5D1">Torre C</div>
</div>
</div>

<div style="padding:12px 14px;border-radius:12px;background:var(--pc);color:#134E4A;font-size:13px;line-height:1.4;display:flex;align-items:center;gap:10px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M6 8a6 6 0 0112 0c0 7 3 8 3 8H3s3-1 3-8"></path><path d="M10 21a2 2 0 004 0"></path></svg>
<span>Los residentes de los sectores elegidos recibirán una notificación.</span>
</div>

</div>

<div style="margin-top:auto;padding:0 20px 32px">
<button style="width:100%;height:56px;border:0;border-radius:12px;background:#0F766E;color:#ffffff;font:700 17px 'Inter',system-ui,sans-serif">Publicar aviso</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
