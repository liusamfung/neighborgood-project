<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Reportar incidencia</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="--p:#0F766E;--pc:#D5EFEA;--bg:#F6F8F7;--t:#1F2937;--m:#5B6672;--line:#E2E8E6;width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;font-family:'Inter',system-ui,sans-serif;color:var(--t);background:var(--bg)">

<div style="height:64px;flex:none;display:flex;align-items:center;gap:4px;padding:0 8px">
<button aria-label="Volver" style="width:44px;height:44px;border:0;background:transparent;color:var(--t);display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></button>
<div style="font-size:20px;font-weight:700">Reportar incidencia</div>
</div>

<div style="padding:8px 20px 0;display:flex;flex-direction:column;gap:16px">

<div>
<label for="titulo" style="display:block;font-size:14px;font-weight:600;margin-bottom:6px">Título</label>
<input id="titulo" value="Luz quemada en el pasillo del piso 3" style="width:100%;height:52px;box-sizing:border-box;border:1px solid #CBD5D1;border-radius:12px;padding:0 14px;font:400 16px 'Inter',system-ui,sans-serif;color:#1F2937;background:#ffffff">
</div>

<div>
<label for="desc" style="display:block;font-size:14px;font-weight:600;margin-bottom:6px">Descripción</label>
<textarea id="desc" rows="4" style="width:100%;height:112px;box-sizing:border-box;border:1px solid #CBD5D1;border-radius:12px;padding:12px 14px;font:400 16px 'Inter',system-ui,sans-serif;color:#1F2937;background:#ffffff;resize:none">Desde el lunes la luz del pasillo de la Torre A, piso 3, no enciende. Por la noche queda muy oscuro cerca de las escaleras.</textarea>
</div>

<div>
<div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px">
<div style="font-size:14px;font-weight:600">Fotos</div>
<div style="font-size:13px;color:var(--m)">Puedes añadir varias</div>
</div>
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px">
<div style="height:96px;border-radius:12px;background:#E2E8E6;color:#5B6672;display:flex;align-items:center;justify-content:center">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="10" r="1.5"></circle><path d="M21 16l-5-5-8 8"></path></svg>
</div>
<div style="height:96px;border-radius:12px;background:#E2E8E6;color:#5B6672;display:flex;align-items:center;justify-content:center">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="10" r="1.5"></circle><path d="M21 16l-5-5-8 8"></path></svg>
</div>
<button aria-label="Agregar foto" style="height:96px;border:2px dashed #0F766E;border-radius:12px;background:#ffffff;color:#0F766E;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:600 13px 'Inter',system-ui,sans-serif">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>Agregar</button>
</div>
</div>

<div style="padding:12px 14px;border-radius:12px;background:var(--pc);color:#134E4A;font-size:13px;line-height:1.4;display:flex;align-items:center;gap:10px">
<span style="flex:none;font-size:12px;font-weight:700;background:#FEF3C7;color:#92400E;padding:4px 10px;border-radius:999px">Pendiente</span>
<span>Así quedará el estado inicial. Podrás seguir su avance.</span>
</div>

</div>

<div style="margin-top:auto;padding:0 20px 32px">
<button style="width:100%;height:56px;border:0;border-radius:12px;background:#0F766E;color:#ffffff;font:700 17px 'Inter',system-ui,sans-serif">Enviar incidencia</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
